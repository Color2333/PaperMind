# PaperMind Docker Compose - 分离部署配置
# @author Color2333
#
# 端口规划：
# - 前端：3002
# - 后端：8002
#
# 使用方法:
#   1. cp .env.example .env && 编辑 .env 填入 API Key
#   2. docker compose up -d --build
#   3. 访问 http://localhost:3002

services:
  # ==========================================
  # Pi LLM 网关（sidecar）：OpenAI 兼容 HTTP 面（pi-ai 底座）。
  # models.json 由 backend/worker 经共享卷物化（DB 单一事实源），本容器无 DB。
  # ==========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: papermind-gateway
    environment:
      - PAPERMIND_AGENT_DIR=/data
      - PAPERMIND_GATEWAY_PORT=8765
      - PAPERMIND_GATEWAY_HOST=0.0.0.0
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
    volumes:
      - pm_agent_dir:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8765/healthz || exit 1"]  # localhost 在 alpine 可能先解析 ::1
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================
  # Go Core（控制面网关：Executor Protocol → durable-state API）
  # ==========================================
  core:
    build:
      context: ./core
      dockerfile: Dockerfile.core
    container_name: papermind-core
    environment:
      - CORE_ADDR=0.0.0.0:8081
      # P1 fail-closed：缺任一令牌 Core 拒绝启动（见 papermind-core main）
      - CORE_TOKEN=${CORE_TOKEN:?CORE_TOKEN required}
      - STATE_ADDR=http://backend:8000
      - STATE_TOKEN=${DURABLE_STATE_TOKEN:?DURABLE_STATE_TOKEN required}
      - RECONCILE_INTERVAL_S=15
      - RECLAIM_BACKOFF_S=60
      # Go authority（第四轮 P0-2/P0-3）：权威 core_* 表与领域表同库（PG），
      # 与 Python 侧 DATABASE_URL 指向同一 postgres
      - CORE_DB_PATH=${CORE_PG_DSN:-postgresql://papermind:papermind@postgres:5432/papermind?sslmode=disable}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    # readiness：/readyz 探测 durable-state 可用性（state 不可达 → 503 → unhealthy）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ==========================================
  # 后端服务 (FastAPI；durable-state 内部 API 需 DURABLE_STATE_TOKEN)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: papermind-backend
    ports:
      - "8002:8000"  # 映射到 8002（避免 8001 冲突）
    volumes:
      - pm_data:/app/data
      - pm_logs:/app/logs
      - pm_pip_cache:/.pip-cache
      - pm_agent_dir:/data
    env_file:
      - ./.env
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SITE_URL=https://pm.vibingu.cn
      - CORS_ALLOW_ORIGINS=http://localhost:3002,http://127.0.0.1:3002,https://pm.vibingu.cn
      - DEMO_MODE=false
      # P1 PG 切换：DATABASE_URL 显式指定 PG
      - DATABASE_URL=${PAPER_PG_DSN:-postgresql+psycopg2://papermind:papermind@postgres:5432/papermind}
      # durable-state 内部 API（P0）：非空才挂载 /internal/durable/*，Core 凭此访问权威状态
      - DURABLE_STATE_TOKEN=${DURABLE_STATE_TOKEN:-}
      # Go authority（manifest 路由）：A 档 capability 提交 Go 权威，其余留 Python
      - PAPERMIND_CORE_URL=http://core:8081
      # 管线 LLM 统一走 Pi 网关（gateway sidecar——OpenAI 兼容面，pi-ai 底座）：
      # sidecar 不可达自动回退直连；PAPERMIND_AGENT_DIR 为共享物化卷（DB 单一事实源）
      - PAPERMIND_LLM_GATEWAY=1
      - PAPERMIND_GATEWAY_URL=http://gateway:8765
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
      - PAPERMIND_AGENT_DIR=/data
      - PAPERMIND_CORE_TOKEN=${CORE_TOKEN:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # Worker 服务 (定时任务 + 闲时处理)
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: papermind-worker
    command: python -m apps.worker.main
    volumes:
      - pm_data:/app/data
      - pm_logs:/app/logs
      - pm_pip_cache:/.pip-cache
      - pm_agent_dir:/data
    env_file:
      - ./.env
    environment:
      - APP_ENV=production
      - SITE_URL=https://pm.vibingu.cn
      - DATABASE_URL=${PAPER_PG_DSN:-postgresql+psycopg2://papermind:papermind@postgres:5432/papermind}
      # Executor 宿主（C7）：经 Go Core 领取执行；未配置则仅调度提交
      - CORE_ADDR=core:8081
      - CORE_TOKEN=${CORE_TOKEN:-}
      # compute 池 Runner 副本数（deep_read 等长任务占线时轻任务的吞吐保障）
      - WORKER_COMPUTE_CONCURRENCY=${WORKER_COMPUTE_CONCURRENCY:-2}
      # 观察面客户端（idle_processor/queries）与执行器同令牌——缺它全部 401
      - PAPERMIND_CORE_TOKEN=${CORE_TOKEN:-}
      - PAPERMIND_CORE_URL=http://core:8081
      # Pi LLM 网关（sidecar）：同 backend
      - PAPERMIND_LLM_GATEWAY=1
      - PAPERMIND_GATEWAY_URL=http://gateway:8765
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
      - PAPERMIND_AGENT_DIR=/data
      - WORKER_EXECUTOR_ID=worker-1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # worker 共用 Dockerfile.backend（含 HEALTHCHECK curl 8000/health），但 worker
    # 不跑 uvicorn，继承的 healthcheck 会误判 unhealthy。显式禁用 worker healthcheck。
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # 数据库服务 (PostgreSQL + pgvector)
  # ==========================================
  # 镜像带 pgvector 扩展（即使当前不用 ANN 也已就绪）。
  # DATABASE_URL=sqlite://... 时 backend/worker 不会实际连接，但容器会启动占位；
  # 切到 postgresql+psycopg2://... 后即自动使用。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papermind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: papermind
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
    ports:
      - "127.0.0.1:5432:5432"  # 只对宿主本地暴露，外部不直连
    volumes:
      - papermind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 前端服务 (Nginx 托管静态文件)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papermind-frontend
    ports:
      - "3002:80"  # 映射到 3002（避免 3001 冲突）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ==========================================
  # Demo 独立实例（Stage G1：独立 DB/文件卷/额度；隔离是实例级的）
  # 使用：docker compose --profile demo up
  # ==========================================
  demo:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: papermind-demo
    profiles: ["demo"]
    ports:
      - "8003:8000"
    volumes:
      - demo_data:/app/data
      - demo_logs:/app/logs
    env_file:
      - ./.env
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///app/data/demo.db  # 独立 Demo DB
      - DEMO_MODE=true  # 写接口 403 + IP 限流
      - SITE_URL=${DEMO_SITE_URL:-https://demo.pm.vibingu.cn}
      - DURABLE_STATE_TOKEN=${DEMO_DURABLE_STATE_TOKEN:?required}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - AUTH_PASSWORD=  # Demo 免密（DemoMode 中间件拦截写接口）
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

# ==========================================
# 数据卷定义（持久化存储）
# ==========================================
volumes:
  pm_data:
    name: papermind_data
  pm_logs:
    name: papermind_logs
  pm_agent_dir:
  pm_pip_cache:
  papermind_pgdata:
    name: papermind_pgdata
  demo_data:
    name: papermind_demo_data
  demo_logs:
    name: papermind_demo_logs
