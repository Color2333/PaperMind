# PaperMind Docker Compose - 分离部署配置
# @author Color2333
#
# 端口规划：
# - 前端：3002
# - 后端：8002
#
# 使用方法:
#   1. cp .env.example .env && 编辑 .env 填入 API Key
#   2. docker compose up -d --build
#   3. 访问 http://localhost:3002

services:
  # ==========================================
  # Go API Server（2.1 绞杀者入口）：已移植路由直接执行，未移植反代 backend。
  # frontend 的 /api/ upstream 经挂载的 nginx.goserver.conf 指向本服务。
  # ==========================================
  goserver:
    build:
      # 仓库根为 context（Dockerfile 内引用 pm_agent/ 与 server/ 源码）
      context: .
      dockerfile: server/Dockerfile
    container_name: papermind-goserver
    volumes:
      - pm_agent_dir:/data
      - pm_data:/app/data
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=${PAPER_PG_DSN:-postgresql://papermind:papermind@postgres:5432/papermind?sslmode=disable}
      - BACKEND_ORIGIN=http://backend:8000
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - SITE_URL=${SITE_URL:-https://pm.vibingu.cn}
      - LISTEN_ADDR=:8080
      # Phase 4：Go 端点直连网关/embedding/PDF 根（worker 同构环境）
      - PAPERMIND_GATEWAY_URL=http://gateway:8765
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
      - PDF_STORAGE_ROOT=/app/data/papers
      - PAPERMIND_AGENT_DIR=/data
      - PAPERMIND_SELF_URL=http://goserver:8080
      - S2_API_KEY=${S2_API_KEY:-}
      - IEEE_API_KEY=${IEEE_API_KEY:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  # ==========================================
  # Pi LLM 网关（sidecar）：OpenAI 兼容 HTTP 面（pi-ai 底座）。
  # models.json 由 backend/worker 经共享卷物化（DB 单一事实源），本容器无 DB。
  # ==========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: papermind-gateway
    environment:
      - PAPERMIND_AGENT_DIR=/data
      - PAPERMIND_GATEWAY_PORT=8765
      - PAPERMIND_GATEWAY_HOST=0.0.0.0
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
    volumes:
      - pm_agent_dir:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8765/healthz || exit 1"]  # localhost 在 alpine 可能先解析 ::1
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ==========================================
  # Go Core（控制面网关：Executor Protocol → durable-state API）
  # ==========================================
  core:
    build:
      context: ./core
      dockerfile: Dockerfile.core
    container_name: papermind-core
    environment:
      - CORE_ADDR=0.0.0.0:8081
      # P1 fail-closed：缺任一令牌 Core 拒绝启动（见 papermind-core main）
      - CORE_TOKEN=${CORE_TOKEN:?CORE_TOKEN required}
      - STATE_ADDR=http://backend:8000
      - STATE_TOKEN=${DURABLE_STATE_TOKEN:?DURABLE_STATE_TOKEN required}
      - RECONCILE_INTERVAL_S=15
      - RECLAIM_BACKOFF_S=60
      # Go authority（第四轮 P0-2/P0-3）：权威 core_* 表与领域表同库（PG），
      # 与 Python 侧 DATABASE_URL 指向同一 postgres
      - CORE_DB_PATH=${CORE_PG_DSN:-postgresql://papermind:papermind@postgres:5432/papermind?sslmode=disable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # readiness：PG 连通性（Go 权威面自持——backend 已退役）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ==========================================
  # Go Worker (Phase 3)：嵌入式执行器 + 调度器（单二进制，无 Python 运行时）
  # claim/heartbeat/apply 同进程直调 CoreStore（零 HTTP）；主题/CS 定时调度 +
  # 闲时补偿内联为 scheduler 循环。与 Python worker 经 CAS 领取安全共存，
  # 未移植能力（wiki/brief/figures/translate/email）仍由 Python worker 领取。
  # ==========================================
  worker-go:
    build:
      context: ./core
      dockerfile: Dockerfile.core
      target: worker
    container_name: papermind-worker-go
    env_file:
      - ./.env
    environment:
      - CORE_DB_PATH=${CORE_PG_DSN:-postgresql://papermind:papermind@postgres:5432/papermind?sslmode=disable}
      - WORKER_EXECUTOR_ID=go-worker-1
      # Pi LLM 网关（skim/deep 语义模型映射在网关侧）
      - PAPERMIND_GATEWAY_URL=http://gateway:8765
      - PAPERMIND_GATEWAY_TOKEN=${PAPERMIND_GATEWAY_TOKEN:-pm-gateway-internal}
      # embedding 独立 provider（SiliconFlow bge-m3 等，读 .env）
      - PDF_STORAGE_ROOT=/app/data/papers
      - PAPERMIND_AGENT_DIR=/data
      - S2_API_KEY=${S2_API_KEY:-}
      - IEEE_API_KEY=${IEEE_API_KEY:-}
    volumes:
      - pm_data:/app/data
      # Pi 网关 models.json 物化（Python worker 退役后由本容器承担）
      - pm_agent_dir:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ==========================================
  # 数据库服务 (PostgreSQL + pgvector)
  # ==========================================
  # 镜像带 pgvector 扩展（即使当前不用 ANN 也已就绪）。
  # DATABASE_URL=sqlite://... 时 backend/worker 不会实际连接，但容器会启动占位；
  # 切到 postgresql+psycopg2://... 后即自动使用。
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papermind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: papermind
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
    ports:
      - "127.0.0.1:5432:5432"  # 只对宿主本地暴露，外部不直连
    volumes:
      - papermind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 前端服务 (Nginx 托管静态文件)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: papermind-frontend
    ports:
      - "3002:80"  # 映射到 3002（避免 3001 冲突）
    volumes:
      # 绞杀者接缝：/api/ upstream 指向 Go API Server（未移植路由由其反代 backend）
      - ./infra/nginx.goserver.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ==========================================
  # Demo 独立实例（Stage G1：独立 DB/文件卷/额度；隔离是实例级的）
  # 使用：docker compose --profile demo up
  # ==========================================
  demo:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: papermind-demo
    profiles: ["demo"]
    ports:
      - "8003:8000"
    volumes:
      - demo_data:/app/data
      - demo_logs:/app/logs
    env_file:
      - ./.env
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///app/data/demo.db  # 独立 Demo DB
      - DEMO_MODE=true  # 写接口 403 + IP 限流
      - SITE_URL=${DEMO_SITE_URL:-https://demo.pm.vibingu.cn}
      - DURABLE_STATE_TOKEN=${DEMO_DURABLE_STATE_TOKEN:?required}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - AUTH_PASSWORD=  # Demo 免密（DemoMode 中间件拦截写接口）
      # V01：独立 JWT 签名密钥——Demo 签发的令牌对个人主服务无效（跨信任域切断）
      - AUTH_SECRET_KEY=${DEMO_AUTH_SECRET_KEY:-demo-only-secret-rotate-me}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

# ==========================================
# 数据卷定义（持久化存储）
# ==========================================
volumes:
  pm_data:
    name: papermind_data
  pm_logs:
    name: papermind_logs
  pm_agent_dir:
  pm_pip_cache:
  papermind_pgdata:
    name: papermind_pgdata
  demo_data:
    name: papermind_demo_data
  demo_logs:
    name: papermind_demo_logs
